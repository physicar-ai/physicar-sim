<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gazebo Web</title>
  <link rel="stylesheet" href="assets/css/gzweb.css?v=18" id="pc-css">
  <script>
  // 코드 자산(JS/CSS)은 DEV 든 배포든 항상 원본 서버에서 — 정책. CDN 은
  // 콘텐츠(dae·텍스처: worlds/<id>/<rev> + sim-assets/<assets_rev>/meshes)
  // 전용이며 gzweb.js 의 _refreshWorldPub/_worldPubReady 가 담당한다.
  // (예전 static_rev 기반 CDN 코드 로딩은 폐기 — 부트 왕복 2회도 함께 제거)
  (function () {
    var FILES = [
      'assets/lib/protobuf.min.js?v=1',
      'assets/lib/eventemitter2.min.js?v=2',
      'assets/lib/gz.js?v=2',
      'assets/lib/gz3d.js?v=2',
      'assets/js/gz-scene.js?v=4',
      'assets/js/gz-interact.js?v=4',
      'assets/js/gzweb.js?v=71',
      'assets/js/evaluation.js?v=24'
    ];
    var ready = { dom: document.readyState !== 'loading', js: false };
    function maybeInit() {
      if (ready.dom && ready.js && typeof window.init === 'function') { window.init(); }
    }
    document.addEventListener('DOMContentLoaded', function () { ready.dom = true; maybeInit(); });
    FILES.forEach(function (f, i) {
      var s = document.createElement('script');
      s.src = f;
      s.async = false;   // ordered async — 실행 순서 보장
      if (i === FILES.length - 1) {
        s.onload = function () { ready.js = true; maybeInit(); };
      }
      document.head.appendChild(s);
    });
  })();
  </script>
</head>
<body>
  <!-- Toolbar: 3-column grid — respawn left, world chip TRUE center at any
       width, settings right. The chip opens the world modal. -->
  <div id="toolbar">
  <div id="toolbar-left"><!-- evaluation.js mounts its button here --></div>
  <button id="world-chip" class="disabled" onclick="openWorldModal()" title="Select world">Loading...</button>
  <div id="settings">
    <button id="settings-btn" onclick="toggleSettings()" title="Settings"><span class="settings-icon">&#x2699;</span></button>
    <div id="settings-menu">
      <label><input type="checkbox" id="chk-autofollow" onchange="toggleAutoFollow(this.checked); saveSettings()"> Auto Follow</label>
      <label><input type="checkbox" id="chk-grid" onchange="toggleGrid(this.checked); saveSettings()"> Grid</label>
      <label><input type="checkbox" id="chk-axes" onchange="toggleAxes(this.checked); saveSettings()"> TF</label>
      <label><input type="checkbox" id="chk-lidar" onchange="toggleLidar(this.checked); saveSettings()"> LiDAR</label>
      <label><input type="checkbox" id="chk-pose" onchange="togglePose(this.checked); saveSettings()"> Pose Info</label>
      <label id="brightness-row" title="Applies instantly to the viewer and the robot camera; shared across all viewers">
        Brightness
        <span class="b-line"><input type="range" id="brightness-slider" min="0.2" max="2" step="0.1" value="1"
          oninput="setBrightness(this.value)"><span id="brightness-val">1.0</span></span></label>
      <button id="reset-btn" onclick="doReset()" title="Put every object and the car back at its start pose — instant, no world reload">
        <span class="respawn-icon">&#x21ba;</span>Reset Positions</button>
      <button id="respawn-btn" onclick="doRespawn()" title="Reload the whole world — use when the world misbehaves" disabled>
        <span class="respawn-icon">&#x21bb;</span>Reload World</button>
    </div>
  </div>
  </div><!-- /#toolbar -->
  <div id="pose-panel"></div>
  <!-- Object panel: selecting a movable world object shows its live pose and
       a one-click reset to its published origin (also stands fallen objects up) -->
  <div id="object-panel">
    <div class="lp-head"><span id="op-name"></span>
      <span class="lp-close" onclick="gzInteract && gzInteract.deselect()">&times;</span></div>
    <div class="op-rows">
      <div class="op-row"><span>x</span><span id="op-x">&ndash;</span></div>
      <div class="op-row"><span>y</span><span id="op-y">&ndash;</span></div>
      <div class="op-row"><span>yaw</span><span id="op-yaw">&ndash;</span></div>
      <div class="op-row"><span>origin</span><span id="op-origin">&ndash;</span></div>
    </div>
    <button id="op-reset" onclick="resetObjectToOrigin()">&#x21bb; Reset</button>
  </div>
  <div id="light-panel">
    <div class="lp-head"><span id="lp-name"></span>
      <span class="lp-close" onclick="gzInteract && gzInteract.deselect()">&times;</span></div>
    <div class="lp-lights" id="lp-lights">
      <div class="lp-lamp lp-red" onclick="setLightState(_selLight, 'red')"></div>
      <div class="lp-lamp lp-yellow"></div>
      <div class="lp-lamp lp-green" onclick="setLightState(_selLight, 'green')"></div>
    </div>
  </div>
  <div id="container"></div>
  <!-- World modal: official/custom sections, inline delete confirm (no native
       dialogs — they are silently dropped inside webviews), import + progress -->
  <div id="world-modal-overlay" onclick="closeWorldModal()"></div>
  <div id="world-modal">
    <div class="wm-head"><span>Worlds</span>
      <span class="wm-close" onclick="closeWorldModal()">&times;</span></div>
    <div class="wm-body">
      <div class="wm-sec">OFFICIAL WORLD</div>
      <div id="wm-official"></div>
      <div class="wm-sec">CUSTOM WORLD</div>
      <div id="wm-custom"></div>
    </div>
    <div class="wm-foot">
      <div id="wm-status"></div>
    </div>
  </div>
  <!-- Mouse-controls hint, shown on every load: dismissed by any click, the X, or a 10 s timeout -->
  <div id="mouse-hint">
    <div class="mh-card">
      <div class="mh-head"><span>Mouse Controls</span><span class="mh-close">&times;</span></div>
      <svg viewBox="0 0 340 160" font-family="sans-serif">
        <rect x="140" y="40" width="60" height="110" rx="30" fill="#262649" stroke="#aab" stroke-width="2"/>
        <path d="M170 40 V86 M140 86 H200" stroke="#aab" stroke-width="2" fill="none"/>
        <rect x="164" y="54" width="12" height="24" rx="6" fill="#4ade80"/>
        <polyline points="152,62 118,47 64,47" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
        <circle cx="152" cy="62" r="3.5" fill="#60a5fa"/>
        <text x="91" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Rotate</text>
        <text x="91" y="63" text-anchor="middle" font-size="11" fill="#99a">left drag</text>
        <polyline points="188,62 222,47 276,47" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
        <circle cx="188" cy="62" r="3.5" fill="#fbbf24"/>
        <text x="249" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Pan</text>
        <text x="249" y="63" text-anchor="middle" font-size="11" fill="#99a">right drag</text>
        <polyline points="170,80 126,114 72,114" stroke="#4ade80" stroke-width="1.5" fill="none"/>
        <circle cx="170" cy="80" r="3.5" fill="#4ade80"/>
        <text x="99" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Zoom</text>
        <text x="99" y="130" text-anchor="middle" font-size="11" fill="#99a">scroll</text>
      </svg>
      <div class="mh-tip">Click anywhere to close</div>
    </div>
  </div>
</body>
</html>
